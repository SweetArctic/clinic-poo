<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel | Clinica</title>
<style>
body{font-family:system-ui;background:#0f172a;color:#e5e7eb;margin:0}header{padding:16px;background:#111827;border-bottom:1px solid #1f2937;display:flex;gap:8px;align-items:center}a{color:#93c5fd}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}section{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:16px}h2{margin:0 0 10px;color:#93c5fd;font-size:18px}button{padding:8px 12px;border-radius:8px;border:1px solid #2563eb;background:#1d4ed8;color:#fff;cursor:pointer}button.secondary{background:#374151;border-color:#4b5563}ul{list-style:none;padding:0;margin:8px 0}li{padding:6px 8px;border-bottom:1px solid #1f2937}label{display:block;margin:8px 0 4px;color:#9ca3af}input,select{width:100%;padding:8px;border-radius:8px;border:1px solid #374151;background:#0b1220;color:#e5e7eb}
</style>
</head>
<body>
<header>
<div style="flex:1 1 auto">Clinica · Panel</div>
<div id="status" style="font-family:monospace"></div>
<button id="logout" class="secondary">Salir</button>
</header>
<main>
<section>
<h2>Listados</h2>
<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px">
<button id="btnDoctores">Doctores</button>
<button id="btnPacientes">Pacientes</button>
<button id="btnCitas">Citas</button>
</div>
<ul id="list"></ul>
</section>

<section>
<h2>Asignar cita</h2>
<label>Doctor</label>
<select id="citaDoctor"></select>
<label>Paciente</label>
<select id="citaPaciente"></select>
<label>Fecha y hora</label>
<input id="citaFecha" type="datetime-local" />
<label>Motivo</label>
<input id="citaMotivo" placeholder="Motivo" />
<div style="margin-top:8px">
<button id="btnCrearCita">Crear cita</button>
<span id="citaMsg" style="margin-left:12px"></span>
</div>
</section>
</main>
<script>
const token = localStorage.getItem('clinica.token')||''; if(!token){ location.href='/login.html' }
document.getElementById('status').textContent = token ? ('Bearer '+token.slice(0,24)+'…') : '(sin token)'
document.getElementById('logout').onclick = () => { localStorage.removeItem('clinica.token'); location.href='/login.html' }
async function api(method, path, body){ const headers = {}; if(body!==undefined){ headers['Content-Type']='application/json' } if(token){ headers['Authorization']='Bearer '+token } const r = await fetch(path,{ method, headers, body: body!==undefined?JSON.stringify(body):undefined }); const t = await r.text(); try{ return { ok:r.ok, status:r.status, data: JSON.parse(t) } }catch{ return { ok:r.ok, status:r.status, data:t } } }
function renderList(items, type){ const ul = document.getElementById('list'); ul.innerHTML = ''; (items||[]).forEach(it=>{ const li = document.createElement('li'); if(type==='doctor'){ li.textContent = `${it.id} · ${it.nombre} ${it.apellido} — ${it.especialidad}` } else if(type==='paciente'){ li.textContent = `${it.id} · ${it.nombre} ${it.apellido} — DNI ${it.dni}` } else if(type==='cita'){ const fecha = it.fechaHora; li.textContent = `${it.id} · ${fecha} · ${it.motivo} · Doctor ${it.doctor?.nombre} · Paciente ${it.paciente?.nombre}` } ul.appendChild(li) }) }
async function loadDoctores(){ const res = await api('GET','/api/doctores'); if(res.ok){ renderList(res.data,'doctor'); fillDoctorSelect(res.data) } }
async function loadPacientes(){ const res = await api('GET','/api/pacientes'); if(res.ok){ renderList(res.data,'paciente'); fillPacienteSelect(res.data) } }
async function loadCitas(){ const res = await api('GET','/api/citas'); if(res.ok){ renderList(res.data,'cita') } }
function fillDoctorSelect(items){ const sel = document.getElementById('citaDoctor'); sel.innerHTML = ''; (items||[]).forEach(d=>{ const o = document.createElement('option'); o.value = d.id; o.textContent = `${d.id} · ${d.nombre} ${d.apellido}`; sel.appendChild(o) }) }
function fillPacienteSelect(items){ const sel = document.getElementById('citaPaciente'); sel.innerHTML = ''; (items||[]).forEach(p=>{ const o = document.createElement('option'); o.value = p.id; o.textContent = `${p.id} · ${p.nombre} ${p.apellido}`; sel.appendChild(o) }) }
document.getElementById('btnDoctores').onclick = loadDoctores
document.getElementById('btnPacientes').onclick = loadPacientes
document.getElementById('btnCitas').onclick = loadCitas
document.getElementById('btnCrearCita').onclick = async () => { const body = { doctorId: Number(document.getElementById('citaDoctor').value), pacienteId: Number(document.getElementById('citaPaciente').value), fechaHora: document.getElementById('citaFecha').value, motivo: document.getElementById('citaMotivo').value.trim() }; const res = await api('POST','/api/citas', body); const msg = document.getElementById('citaMsg'); msg.textContent = res.ok ? 'Cita creada' : ('Error ('+res.status+'): '+(res.data?.message||res.data)); if(res.ok){ loadCitas() } }
// precarga listas para selects
loadDoctores(); loadPacientes();
</script>
</body>
</html>
