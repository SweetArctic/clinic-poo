<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinica API Console</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;margin:0;background:#0f172a;color:#e5e7eb}header{padding:16px;background:#111827;border-bottom:1px solid #1f2937}main{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}section{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:16px}h2{margin:0 0 12px 0;font-size:16px;color:#93c5fd}label{display:block;margin:8px 0 4px 0;font-size:12px;color:#9ca3af}input,textarea,select{width:100%;padding:8px;border-radius:6px;border:1px solid #374151;background:#0b1220;color:#e5e7eb}textarea{min-height:120px}button{padding:8px 12px;border-radius:6px;border:1px solid #2563eb;background:#1d4ed8;color:#fff;cursor:pointer}button.secondary{background:#374151;border-color:#4b5563}button.inline{margin-left:8px}small{color:#9ca3af}pre{background:#0b1220;border:1px solid #1f2937;border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto}#token{font-family:monospace;word-break:break-all} .row{display:flex;gap:8px;align-items:center} .row>*{flex:1}
</style>
</head>
<body>
<header>
<div class="row">
<div style="flex:0 0 auto;font-weight:600;color:#fef3c7">Clinica API Console</div>
<div style="flex:1"></div>
<button id="btnQuickAdmin" class="secondary">Auto-registro admin</button>
<button id="btnQuickLogin" class="secondary">Login rápido</button>
</div>
</header>
<main>
<section>
<h2>Registro</h2>
<label>Usuario</label>
<input id="suUsername" placeholder="usuario">
<label>Email</label>
<input id="suEmail" placeholder="email@example.com">
<label>Contraseña</label>
<input id="suPassword" type="password" placeholder="********">
<label>Roles separados por coma</label>
<input id="suRoles" placeholder="admin,doctor">
<div class="row">
<button id="btnSignup">Registrar</button>
<button id="btnClearSignup" class="secondary inline">Limpiar</button>
</div>
<small>POST /api/auth/signup</small>
<pre id="signupResp"></pre>
</section>

<section>
<h2>Login</h2>
<label>Usuario</label>
<input id="liUsername" placeholder="usuario">
<label>Contraseña</label>
<input id="liPassword" type="password" placeholder="********">
<div class="row">
<button id="btnLogin">Iniciar sesión</button>
<button id="btnLogout" class="secondary inline">Cerrar sesión</button>
</div>
<small>POST /api/auth/signin</small>
<label>Token</label>
<div id="token"></div>
</section>

<section>
<h2>Solicitudes</h2>
<div class="row">
<select id="reqMethod">
<option>GET</option>
<option>POST</option>
<option>PUT</option>
<option>DELETE</option>
<option>PATCH</option>
</select>
<input id="reqPath" placeholder="/api/pacientes">
</div>
<label>Body JSON</label>
<textarea id="reqBody" placeholder='{"campo":"valor"}'></textarea>
<div class="row">
<button id="btnSend">Enviar</button>
<button id="btnClearReq" class="secondary inline">Limpiar</button>
</div>
<small>Se envía Authorization: Bearer automáticamente si hay token</small>
<pre id="reqResp"></pre>
</section>

<section>
<h2>Atajos</h2>
<div class="row">
<button id="btnListDoctores">GET /api/doctores</button>
<button id="btnListPacientes">GET /api/pacientes</button>
</div>
<div class="row" style="margin-top:8px">
<button id="btnListCitas">GET /api/citas</button>
<button id="btnBuscarPacientes">GET /api/pacientes/buscar/{nombre}</button>
</div>
<div style="margin-top:12px">
<label>Crear paciente rápido</label>
<div class="row">
<input id="qpNombre" placeholder="nombre">
<input id="qpApellido" placeholder="apellido">
<input id="qpDni" placeholder="dni">
<input id="qpTelefono" placeholder="telefono">
</div>
<button id="btnCrearPaciente">POST /api/pacientes</button>
</div>
<pre id="quickResp"></pre>
</section>
</main>
<script>
const el = id => document.getElementById(id)
const state = { token: localStorage.getItem('clinica.token') || '' }
function setToken(t){ state.token = t || ''; if(t){ localStorage.setItem('clinica.token', t) } else { localStorage.removeItem('clinica.token') } el('token').textContent = state.token || '(sin token)'}
setToken(state.token)
async function api(method, path, body){ const headers = {}; const isJson = body !== undefined && body !== null; if(isJson) headers['Content-Type']='application/json'; if(state.token) headers['Authorization']='Bearer '+state.token; const r = await fetch(path, { method, headers, body: isJson ? JSON.stringify(body) : undefined }); const text = await r.text(); let data = text; try{ data = JSON.parse(text) }catch{} return { ok: r.ok, status: r.status, data }
}
el('btnSignup').onclick = async () => { const rolesRaw = el('suRoles').value.trim(); const roles = rolesRaw ? rolesRaw.split(',').map(r=>r.trim()).filter(Boolean) : undefined; const body = { username: el('suUsername').value.trim(), email: el('suEmail').value.trim(), password: el('suPassword').value, role: roles }; const res = await api('POST','/api/auth/signup', body); el('signupResp').textContent = JSON.stringify(res, null, 2) }
el('btnClearSignup').onclick = () => { el('suUsername').value=''; el('suEmail').value=''; el('suPassword').value=''; el('suRoles').value=''; el('signupResp').textContent='' }
el('btnLogin').onclick = async () => { const body = { username: el('liUsername').value.trim(), password: el('liPassword').value }; const res = await api('POST','/api/auth/signin', body); el('signupResp').textContent=''; el('reqResp').textContent=''; if(res.ok && res.data && res.data.token){ setToken(res.data.token) } el('token').textContent = state.token || '(sin token)' }
el('btnLogout').onclick = () => { setToken('') }
el('btnSend').onclick = async () => { let body; const method = el('reqMethod').value; const path = el('reqPath').value.trim() || '/'; const raw = el('reqBody').value.trim(); if(raw){ try{ body = JSON.parse(raw) }catch{ body = raw } } const res = await api(method, path, body); el('reqResp').textContent = JSON.stringify(res, null, 2) }
el('btnClearReq').onclick = () => { el('reqBody').value=''; el('reqResp').textContent='' }
el('btnListDoctores').onclick = async () => { const res = await api('GET','/api/doctores'); el('quickResp').textContent = JSON.stringify(res, null, 2) }
el('btnListPacientes').onclick = async () => { const res = await api('GET','/api/pacientes'); el('quickResp').textContent = JSON.stringify(res, null, 2) }
el('btnListCitas').onclick = async () => { const res = await api('GET','/api/citas'); el('quickResp').textContent = JSON.stringify(res, null, 2) }
el('btnBuscarPacientes').onclick = async () => { const nombre = prompt('Nombre'); if(!nombre) return; const res = await api('GET','/api/pacientes/buscar/'+encodeURIComponent(nombre)); el('quickResp').textContent = JSON.stringify(res, null, 2) }
el('btnCrearPaciente').onclick = async () => { const body = { nombre: el('qpNombre').value.trim(), apellido: el('qpApellido').value.trim(), dni: el('qpDni').value.trim(), telefono: el('qpTelefono').value.trim() }; const res = await api('POST','/api/pacientes', body); el('quickResp').textContent = JSON.stringify(res, null, 2) }
el('btnQuickAdmin').onclick = async () => { const u = 'admin_'+Math.floor(Math.random()*1e6); const body = { username: u, email: u+'@example.com', password: 'Clinica123!', role: ['admin'] }; const res = await api('POST','/api/auth/signup', body); el('signupResp').textContent = JSON.stringify(res, null, 2); el('liUsername').value = u; el('liPassword').value = 'Clinica123!' }
el('btnQuickLogin').onclick = async () => { const body = { username: el('liUsername').value.trim(), password: el('liPassword').value }; const res = await api('POST','/api/auth/signin', body); if(res.ok && res.data && res.data.token){ setToken(res.data.token) } el('reqResp').textContent = JSON.stringify(res, null, 2) }
</script>
</body>
</html>
