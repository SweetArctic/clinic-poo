<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registro | Clinica</title>
<style>
body{font-family:system-ui;background:#0f172a;color:#e5e7eb;margin:0}main{max-width:720px;margin:40px auto;padding:24px;background:#111827;border:1px solid #1f2937;border-radius:12px}h1{margin:0 0 16px;font-size:20px;color:#93c5fd}label{display:block;margin:12px 0 6px;color:#9ca3af}input{width:100%;padding:10px;border-radius:8px;border:1px solid #374151;background:#0b1220;color:#e5e7eb}button{margin-top:16px;padding:10px 14px;border-radius:8px;border:1px solid #2563eb;background:#1d4ed8;color:#fff;cursor:pointer}small{color:#9ca3af}a{color:#93c5fd}
</style>
</head>
<body>
<main>
<h1>Crear cuenta</h1>
<label>Usuario</label>
<input id="username" placeholder="usuario" />
<label>Email</label>
<input id="email" placeholder="email@example.com" />
<label>Contraseña</label>
<input id="password" type="password" placeholder="********" />
<label>Roles (opcional, separados por coma)</label>
<input id="roles" placeholder="admin,doctor" />
<button id="submit">Registrar</button>
<p id="msg"></p>
<small>¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></small>
</main>
<script>
async function apiSignup(body){ const r = await fetch('/api/auth/signup',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}); const t = await r.text(); try{ return { ok:r.ok, status:r.status, data: JSON.parse(t)} }catch{ return { ok:r.ok, status:r.status, data:t } } }
document.getElementById('submit').onclick = async () => {
  const rolesRaw = document.getElementById('roles').value.trim();
  const roles = rolesRaw ? rolesRaw.split(',').map(r=>r.trim()).filter(Boolean) : undefined;
  const body = {
    username: document.getElementById('username').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
    role: roles
  };
  const res = await apiSignup(body);
  const msg = document.getElementById('msg');
  msg.textContent = res.ok ? 'Registro exitoso. Redirigiendo a login...' : ('Error ('+res.status+'): '+(res.data?.message||res.data));
  if(res.ok){ setTimeout(()=>{ location.href='/login.html' }, 1000) }
}
</script>
</body>
</html>
